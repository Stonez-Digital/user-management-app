name: Bulk-import signed context PostgreSQL verifier

on:
  pull_request:
  push:
    branches:
      - security/bulk-worker-signed-context-verifier
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bulk-context-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-context-verifier:
    name: PostgreSQL 17 signed-context verifier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bulk_context_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bulk_context_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client (retry transient mirror failures)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client; then
              psql --version
              exit 0
            fi
            if [[ "${attempt}" -eq 5 ]]; then
              echo "::error::PostgreSQL client installation failed after five attempts."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "Package mirror/network failure; retrying in ${delay}s (attempt ${attempt}/5)."
            sleep "${delay}"
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run disposable PostgreSQL 17 verifier tests
        env:
          BULK_CONTEXT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bulk_context_test?sslmode=disable
          BULK_CONTEXT_TEST_WORKER_URL: postgres://stonez_bulk_worker_processing_test:bulk_context_worker_ci_password@localhost:5432/bulk_context_test?sslmode=disable
          BULK_CONTEXT_TEST_DATABASE: bulk_context_test
          BULK_CONTEXT_TEST_SIGNING_KEY_HEX: efefefefefefefefefefefefefefefefefefefefefefefefefefefefefefefef
        run: |
          bash scripts/security/test_bulk_import_context_verifier.sh
          go test ./internal/database -run TestBulkImportSignedContextReadinessAndProcessingRole -count=1
          go test ./internal/service -run TestBulkImportCredentialOutboxWorkerCrashRetry -count=1
