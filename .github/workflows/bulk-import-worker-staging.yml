name: Bulk Import Worker (Staging)

# Keep this workflow manual until the dedicated staging worker has passed
# an operator-triggered end-to-end smoke test. Add a schedule only after
# that evidence has been reviewed and approved.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stonez-bulk-import-worker-staging
  cancel-in-progress: false

jobs:
  process:
    name: Process queued staging imports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_DRIVER: postgres
      APP_ENV: staging
      BULK_IMPORT_PROCESSING_DATABASE_URL: ${{ secrets.BULK_IMPORT_PROCESSING_DATABASE_URL }}
      BULK_IMPORT_CLAIM_DATABASE_URL: ${{ secrets.BULK_IMPORT_CLAIM_DATABASE_URL }}
      BULK_IMPORT_CONTEXT_VAULT_ADDR: ${{ secrets.BULK_IMPORT_CONTEXT_VAULT_ADDR }}
      BULK_IMPORT_CONTEXT_VAULT_KV_MOUNT: ${{ secrets.BULK_IMPORT_CONTEXT_VAULT_KV_MOUNT }}
      BULK_IMPORT_CONTEXT_VAULT_KV_PATH: ${{ secrets.BULK_IMPORT_CONTEXT_VAULT_KV_PATH }}
      BULK_IMPORT_CONTEXT_VAULT_TOKEN: ${{ secrets.BULK_IMPORT_CONTEXT_VAULT_TOKEN }}
      BULK_IMPORT_WORKER_MAX_RUNTIME: 4m
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
      SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APP_LOGIN_URL: ${{ secrets.APP_LOGIN_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Validate required staging secrets
        shell: bash
        run: |
          test -n "$BULK_IMPORT_PROCESSING_DATABASE_URL" || { echo "BULK_IMPORT_PROCESSING_DATABASE_URL secret is required" >&2; exit 1; }
          test -n "$BULK_IMPORT_CLAIM_DATABASE_URL" || { echo "BULK_IMPORT_CLAIM_DATABASE_URL secret is required" >&2; exit 1; }
          test -n "$BULK_IMPORT_CONTEXT_VAULT_ADDR" || { echo "BULK_IMPORT_CONTEXT_VAULT_ADDR secret is required" >&2; exit 1; }
          test -n "$BULK_IMPORT_CONTEXT_VAULT_KV_MOUNT" || { echo "BULK_IMPORT_CONTEXT_VAULT_KV_MOUNT secret is required" >&2; exit 1; }
          test -n "$BULK_IMPORT_CONTEXT_VAULT_KV_PATH" || { echo "BULK_IMPORT_CONTEXT_VAULT_KV_PATH secret is required" >&2; exit 1; }
          test -n "$BULK_IMPORT_CONTEXT_VAULT_TOKEN" || { echo "BULK_IMPORT_CONTEXT_VAULT_TOKEN secret is required" >&2; exit 1; }
      - name: Write short-lived Vault token file
        shell: bash
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/bulk-import-vault-token"
          umask 077
          printf '%s' "$BULK_IMPORT_CONTEXT_VAULT_TOKEN" > "$token_file"
          echo "BULK_IMPORT_CONTEXT_VAULT_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          unset BULK_IMPORT_CONTEXT_VAULT_TOKEN
      - name: Build worker
        run: CGO_ENABLED=1 go build -o /tmp/bulk-import-worker ./cmd/bulk-import-worker
      - name: Run worker polling window
        run: /tmp/bulk-import-worker
