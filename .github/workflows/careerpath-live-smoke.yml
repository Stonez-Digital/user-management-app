name: CareerPath authenticated live smoke test

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "HTTPS API origin (for example, the Render API URL); never enter credentials here"
        required: true
        type: string
      confirm_create_attempts:
        description: "Allow creating/resuming draft attempts for both designated QA students"
        required: true
        type: choice
        options: ["no", "yes"]
        default: "no"
      confirm_immutable_submit:
        description: "Also submit Student A's complete attempt (submitted attempts are immutable)"
        required: true
        type: choice
        options: ["no", "yes"]
        default: "no"

permissions:
  contents: read

jobs:
  live-smoke:
    name: Authenticated CareerPath isolation and workflow checks
    if: ${{ inputs.confirm_create_attempts == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate test configuration
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          QA_A_EMAIL: ${{ secrets.CAREERPATH_QA_STUDENT_A_EMAIL }}
          QA_A_PASSWORD: ${{ secrets.CAREERPATH_QA_STUDENT_A_PASSWORD }}
          QA_A_SCHOOL_CODE: ${{ secrets.CAREERPATH_QA_STUDENT_A_SCHOOL_CODE }}
          QA_B_EMAIL: ${{ secrets.CAREERPATH_QA_STUDENT_B_EMAIL }}
          QA_B_PASSWORD: ${{ secrets.CAREERPATH_QA_STUDENT_B_PASSWORD }}
          QA_B_SCHOOL_CODE: ${{ secrets.CAREERPATH_QA_STUDENT_B_SCHOOL_CODE }}
          CONFIRM_IMMUTABLE_SUBMIT: ${{ inputs.confirm_immutable_submit }}
        run: |
          set -euo pipefail
          node --version
          node -e 'const u=new URL(process.env.API_BASE_URL); if(u.protocol!=="https:") throw Error("API_BASE_URL must use HTTPS"); if(u.username||u.password||u.search||u.hash) throw Error("API_BASE_URL must be an origin/path without credentials, query, or fragment");'
          for name in QA_A_EMAIL QA_A_PASSWORD QA_A_SCHOOL_CODE QA_B_EMAIL QA_B_PASSWORD QA_B_SCHOOL_CODE; do
            if [ -z "${!name:-}" ]; then echo "::error::Required GitHub Actions secret is missing: $name"; exit 1; fi
          done
          if [ "$QA_A_EMAIL" = "$QA_B_EMAIL" ]; then echo "::error::Student A and B must be different QA accounts"; exit 1; fi
          if [ "$CONFIRM_IMMUTABLE_SUBMIT" = "yes" ]; then echo "Immutable submission is explicitly enabled for this run."; else echo "Submission disabled; this run will verify draft save/resume and access denial only."; fi

      - name: Run authenticated live API checks
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          QA_A_EMAIL: ${{ secrets.CAREERPATH_QA_STUDENT_A_EMAIL }}
          QA_A_PASSWORD: ${{ secrets.CAREERPATH_QA_STUDENT_A_PASSWORD }}
          QA_A_SCHOOL_CODE: ${{ secrets.CAREERPATH_QA_STUDENT_A_SCHOOL_CODE }}
          QA_B_EMAIL: ${{ secrets.CAREERPATH_QA_STUDENT_B_EMAIL }}
          QA_B_PASSWORD: ${{ secrets.CAREERPATH_QA_STUDENT_B_PASSWORD }}
          QA_B_SCHOOL_CODE: ${{ secrets.CAREERPATH_QA_STUDENT_B_SCHOOL_CODE }}
          CONFIRM_IMMUTABLE_SUBMIT: ${{ inputs.confirm_immutable_submit }}
        run: node scripts/careerpath-live-smoke.mjs
