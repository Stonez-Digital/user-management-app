name: Cloudflare Deployment

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/cloudflare-deploy.yml"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      API_SERVER_URL: ${{ secrets.API_SERVER_URL || vars.API_SERVER_URL }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Cloudflare compatibility build
        run: npm run build:vinext

      - name: Check Cloudflare deployment configuration
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not available to the production environment."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not available to the production environment."
            missing=1
          fi
          if [ -z "$API_SERVER_URL" ]; then
            echo "::error::API_SERVER_URL is not available to the production environment."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Add the missing values to Settings > Environments > production as environment secrets or environment variables."
            exit 1
          fi
          echo "Cloudflare deployment configuration is present."

      - name: Deploy to Cloudflare Workers
        run: npm run deploy

      - name: Verify deployed Worker
        run: npx wrangler deployments list --name stonez-school-management
