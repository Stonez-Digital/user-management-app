name: Cloudflare Deployment

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/cloudflare-deploy.yml"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_SERVER_URL: ${{ secrets.API_SERVER_URL }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Cloudflare compatibility build
        run: npm run build:vinext

      - name: Check Cloudflare deployment configuration
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$API_SERVER_URL" ]; then
            echo "::notice::Cloudflare deployment skipped because CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, or API_SERVER_URL is not configured."
            echo "The frontend and Cloudflare/vinext builds passed."
            echo "Configure the production environment secrets and run this workflow manually to deploy."
          else
            echo "Cloudflare deployment configuration is present."
          fi

      - name: Deploy to Cloudflare Workers
        if: ${{ github.event_name == 'workflow_dispatch' || (env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.API_SERVER_URL != '') }}
        run: npm run deploy

      - name: Verify deployed Worker
        if: ${{ github.event_name == 'workflow_dispatch' || (env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '') }}
        run: npx wrangler deployments list --name stonez-school-management
