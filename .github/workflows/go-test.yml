name: Go Tests

on:
  pull_request:
    branches: [main, feat/classes-sections, feat/subjects, feat/teacher-assignments]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Test
        run: go test ./...
