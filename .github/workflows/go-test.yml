name: Go Tests

on:
  pull_request:
  push:
    branches: [main, fix/supabase-pg17-queue-role-provisioning, feat/dedicated-bulk-import-worker-claim-connection]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usersdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d usersdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/usersdb_test?sslmode=disable
      BULK_QUEUE_SCRIPT_TEST_DATABASE_URL: postgres://bq_script_runner:queue_script_runner_ci_password@localhost:5432/bulk_queue_scripts_test?sslmode=disable
      BULK_QUEUE_SCRIPT_TEST_RUNTIME_URL: postgres://stonez_bulk_worker:queue_script_worker_ci_password@localhost:5432/bulk_queue_scripts_test?sslmode=disable
      BULK_QUEUE_SCRIPT_TEST_OUTSIDER_URL: postgres://bq_script_outsider:queue_script_outsider_ci_password@localhost:5432/bulk_queue_scripts_test?sslmode=disable
      BULK_QUEUE_SCRIPT_TEST_DATABASE: bulk_queue_scripts_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Provision isolated non-superuser SQL-script test identity
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE bulk_queue_scripts_test"
          psql -h localhost -U postgres -d bulk_queue_scripts_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bq_script_runner LOGIN CREATEROLE NOSUPERUSER NOBYPASSRLS PASSWORD 'queue_script_runner_ci_password';
          GRANT CREATE ON DATABASE bulk_queue_scripts_test TO bq_script_runner;
          ALTER SCHEMA public OWNER TO bq_script_runner;
          SQL
      - name: Execute actual bulk-import queue SQL scripts against disposable PostgreSQL
        run: bash scripts/security/test_bulk_import_queue_role_scripts.sh
      - name: Execute signed-context installer/verifier with both pgcrypto schemas
        env:
          PGPASSWORD: postgres
        run: bash scripts/security/test_bulk_import_signed_context_pgcrypto.sh
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Test
        run: go test -p 1 ./...
