name: Install signed bulk-import queue claim on Neon staging

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'Type STONEZ-STAGING to authorize the isolated staging installation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-bulk-import-staging-install
  cancel-in-progress: false

jobs:
  install-staging-claim:
    if: github.ref == 'refs/heads/security/bulk-worker-signed-context-verifier' && inputs.confirm_target == 'STONEZ-STAGING'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v4
        with:
          ref: security/bulk-worker-signed-context-verifier

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate the exact staging endpoint and installer role
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "::error::NEON_STAGING_DATABASE_URL repository secret is not configured."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse, parse_qs
          u = urlparse(os.environ["DATABASE_URL"])
          q = parse_qs(u.query)
          assert u.scheme in ("postgres", "postgresql"), "Expected PostgreSQL URL"
          assert u.hostname == "ep-snowy-term-b94cw7vl.c-7.eu-central-1.aws.neon.tech", "Unexpected database host"
          assert u.path == "/stonez_staging", "Unexpected database name"
          assert q.get("sslmode", [""])[0] in ("require", "verify-ca", "verify-full"), "TLS must be enabled"
          assert u.username == "stonez_staging_owner", "Use the approved staging installation role"
          print("Approved Neon staging endpoint, database, installer role, and TLS mode confirmed.")
          PY
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          BEGIN
            IF current_database() <> 'stonez_staging'
               OR current_user <> 'stonez_staging_owner'
               OR current_setting('server_version_num')::int < 170000 THEN
              RAISE EXCEPTION 'unexpected staging target or installer role';
            END IF;
          END
          $;
          SQL

      - name: Verify the already-provisioned queue roles
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/security/verify_bulk_import_queue_roles.sql

      - name: Install only the queue claim function
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/security/install_bulk_import_claim_function.sql

      - name: Verify queue claim function ownership and execution boundary
        env:
          DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            fn oid := to_regprocedure('stonez_internal.claim_next_bulk_import_job(uuid)');
            owner_name text;
          BEGIN
            IF fn IS NULL THEN
              RAISE EXCEPTION 'queue claim function was not installed';
            END IF;
            SELECT r.rolname INTO owner_name
              FROM pg_proc p JOIN pg_roles r ON r.oid = p.proowner
             WHERE p.oid = fn;
            IF owner_name <> 'stonez_bulk_queue_owner'
               OR NOT (SELECT prosecdef FROM pg_proc WHERE oid = fn)
               OR EXISTS (
                    SELECT 1
                      FROM pg_proc p
                      CROSS JOIN LATERAL aclexplode(COALESCE(p.proacl, acldefault('f', p.proowner))) a
                     WHERE p.oid = fn
                       AND a.grantee = 0
                       AND a.privilege_type = 'EXECUTE'
               )
               OR NOT has_function_privilege('stonez_bulk_queue_claim', fn, 'EXECUTE')
               OR has_function_privilege('stonez_api_runtime', fn, 'EXECUTE') THEN
              RAISE EXCEPTION 'queue claim function ownership or EXECUTE boundary is unsafe';
            END IF;
          END
          $$;
          SELECT 'queue claim installer and post-install checks passed on staging' AS result;
          SQL
