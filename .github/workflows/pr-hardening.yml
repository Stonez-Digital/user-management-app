name: PR hardening checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  race:
    name: Go race detector
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run complete Go suite with race detector
        run: go test -race ./...

  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --pull --tag stonez-user-management-app:pr-check .
