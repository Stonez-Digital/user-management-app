name: Production Acceptance

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional QA run identifier"
        required: false
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    name: Two-school production acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_API_URL: https://stonez-digital-school-api.onrender.com
      PRODUCTION_FRONTEND_URL: https://app.stonezdigital.com.ng
      PRODUCTION_QA_SUPER_ADMIN_EMAIL: ${{ secrets.PRODUCTION_QA_SUPER_ADMIN_EMAIL }}
      PRODUCTION_QA_SUPER_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_QA_SUPER_ADMIN_PASSWORD }}
      PRODUCTION_QA_SCHOOLS_JSON: ${{ secrets.PRODUCTION_QA_SCHOOLS_JSON }}
      QA_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cloudflare and API preflight
        shell: bash
        run: |
          set -euo pipefail
          challenged=0
          failed=0

          check_edge() {
            local url="$1"
            local body headers status curl_rc curl_output
            body="$(mktemp)"
            headers="$(mktemp)"
            : >"$body"
            : >"$headers"
            curl_rc=0

            if curl_output="$(curl --silent --show-error --location --max-time 30 \
              --dump-header "$headers" --output "$body" \
              --write-out '%{http_code}' "$url")"; then
              status="$curl_output"
            else
              curl_rc=$?
              status="${curl_output:-000}"
            fi

            if (( curl_rc == 0 )) && [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
              echo "PASS — $url (HTTP $status)"
            elif grep -Eiq '^cf-mitigated:[[:space:]]*challenge([[:space:]]|$)' "$headers"; then
              echo "::warning::INCONCLUSIVE — Cloudflare challenge blocked non-browser probe: $url (HTTP $status)"
              challenged=$((challenged + 1))
            else
              echo "::error::FAIL — $url (HTTP $status; curl exit $curl_rc)"
              awk '/^HTTP\// || tolower($0) ~ /^(cf-ray|server|retry-after|content-type|location):/ { print }' "$headers" | tail -n 20
              if [[ -s "$body" ]]; then
                echo "Response excerpt:"
                head -c 500 "$body" | tr '\r\n' ' '
                echo
              fi
              failed=$((failed + 1))
            fi
            rm -f "$body" "$headers"
          }

          check_api() {
            local url="$1"
            local status curl_rc curl_output
            curl_rc=0
            if curl_output="$(curl --silent --show-error --location --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")"; then
              status="$curl_output"
            else
              curl_rc=$?
              status="${curl_output:-000}"
            fi
            if (( curl_rc == 0 )) && [[ "$status" == "200" ]]; then
              echo "PASS — direct Render API health: $url (HTTP 200)"
            else
              echo "::error::FAIL — direct Render API health: $url (HTTP $status; curl exit $curl_rc)"
              failed=$((failed + 1))
            fi
          }

          check_edge "${PRODUCTION_FRONTEND_URL}/"
          check_edge "${PRODUCTION_FRONTEND_URL}/backend/healthz"
          check_api "${PRODUCTION_API_URL}/healthz"

          {
            echo "### Production preflight"
            echo "- Cloudflare edge checks challenged/inconclusive: $challenged"
            echo "- Genuine endpoint failures: $failed"
            echo "- Direct Render /healthz must return HTTP 200."
            echo "- A Cloudflare challenge is not counted as an application pass or failure."
          } >> "$GITHUB_STEP_SUMMARY"

          if (( failed > 0 )); then
            exit 1
          fi

      - name: Run production acceptance
        shell: bash
        run: |
          set -o pipefail
          node scripts/production-acceptance.mjs | tee production-acceptance-result.json

      - name: Upload private acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-result
          path: production-acceptance-result.json
          retention-days: 7
