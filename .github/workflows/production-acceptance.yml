name: Production Acceptance

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional QA run identifier"
        required: false
        type: string
      confirm_production_writes:
        description: "Explicitly authorize temporary QA writes to the two dedicated production QA schools"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

jobs:
  acceptance:
    name: Two-school production acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_API_URL: https://stonez-digital-school-api.onrender.com
      PRODUCTION_FRONTEND_URL: https://app.stonezdigital.com.ng
      PRODUCTION_QA_SUPER_ADMIN_EMAIL: ${{ secrets.PRODUCTION_QA_SUPER_ADMIN_EMAIL }}
      PRODUCTION_QA_SUPER_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_QA_SUPER_ADMIN_PASSWORD }}
      PRODUCTION_QA_SCHOOLS_JSON: ${{ secrets.PRODUCTION_QA_SCHOOLS_JSON }}
      QA_RUN_ID: ${{ inputs.run_id }}
      PRODUCTION_QA_ALLOW_MUTATIONS: ${{ inputs.confirm_production_writes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cloudflare frontend smoke
        shell: bash
        run: |
          set -euo pipefail

          check_endpoint() {
            local url="$1"
            local attempt=1
            local max_attempts=4
            local delay=5
            local body headers status curl_rc curl_output

            body="$(mktemp)"
            headers="$(mktemp)"
            trap 'rm -f "$body" "$headers"' RETURN

            while (( attempt <= max_attempts )); do
              : >"$body"
              : >"$headers"
              curl_rc=0
              if curl_output="$(curl --silent --show-error --location --max-time 30 \
                --dump-header "$headers" --output "$body" \
                --write-out '%{http_code}' "$url")"; then
                status="$curl_output"
              else
                curl_rc=$?
                status="${curl_output:-000}"
              fi

              if (( curl_rc == 0 )) && [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
                echo "Smoke check passed: $url (HTTP $status)"
                return 0
              fi

              local retryable=false
              case "$status" in
                429|502|503|504) retryable=true ;;
              esac
              case "$curl_rc" in
                6|7|18|28|35|52|56) retryable=true ;;
              esac

              if [[ "$retryable" == true && $attempt -lt $max_attempts ]]; then
                echo "Transient smoke-check failure for $url (HTTP $status, curl exit $curl_rc); retry $((attempt + 1))/$max_attempts in ${delay}s."
                sleep "$delay"
                delay=$((delay + 5))
                attempt=$((attempt + 1))
                continue
              fi

              echo "::error::Smoke check failed for $url after $attempt attempt(s): HTTP $status; curl exit $curl_rc."
              echo "Relevant response headers:"
              awk '/^HTTP\// || tolower($0) ~ /^(cf-ray|server|retry-after|content-type|cf-cache-status|location):/ { print }' "$headers" | tail -n 20
              if [[ -s "$body" ]]; then
                echo "Response body excerpt (first 800 bytes):"
                head -c 800 "$body" | tr '\r\n' ' '
                echo
              fi
              return 1
            done
          }

          check_endpoint "${PRODUCTION_FRONTEND_URL}/"
          check_endpoint "${PRODUCTION_FRONTEND_URL}/backend/healthz"

      - name: Run production acceptance
        shell: bash
        run: |
          set -o pipefail
          node scripts/production-acceptance.mjs | tee production-acceptance-result.json

      - name: Upload private acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-acceptance-result
          path: production-acceptance-result.json
          retention-days: 7
