name: Production QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Production QA
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: usersdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d usersdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/usersdb_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      # The standard go test ./... suite is owned by the Go Tests workflow.
      # Keep the additional race and finance-specific production QA here.
      - name: Race detection
        run: go test -race ./...

      - name: Finance transactional smoke harness
        run: go run ./cmd/finance-smoke
        env:
          FINANCE_SMOKE_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  docker:
    name: Production Docker Build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag stonez-school-api:production-qa .

  frontend:
    name: Frontend Production QA
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Confirm frontend QA coverage
        run: echo "Frontend regression tests, production build, and Cloudflare compatibility build are verified by the Frontend Checks workflow."
