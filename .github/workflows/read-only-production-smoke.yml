name: Read-only Production Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Check production frontend and API health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check official frontend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
            --output /dev/null \
            --write-out 'Frontend root: HTTP %{http_code}\n' \
            https://app.stonezdigital.com.ng/

      - name: Check API through the frontend proxy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
            --output /dev/null \
            --write-out 'Frontend-proxied API health: HTTP %{http_code}\n' \
            https://app.stonezdigital.com.ng/backend/healthz

      - name: Check Render API directly
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 30 \
            --output /dev/null \
            --write-out 'Render API health: HTTP %{http_code}\n' \
            https://stonez-digital-school-api.onrender.com/healthz
