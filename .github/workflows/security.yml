name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-security:
    name: Go security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26.x'
          go-package: './...'

  frontend-security:
    name: Frontend dependency security
    runs-on: ubuntu-latest
    needs: go-security
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit development dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          const allowedAdvisory = 'GHSA-vfj7-8cjw-p6xm';

          // Allow only the explicitly reviewed, currently unpatched braces advisory
          // and packages whose complete vulnerability chain leads to that advisory.
          const reachesAllowedAdvisory = (packageName, visiting = new Set()) => {
            if (visiting.has(packageName)) return false;

            const vulnerability = vulnerabilities[packageName];
            if (!vulnerability) return false;

            const nextVisiting = new Set(visiting);
            nextVisiting.add(packageName);

            return (vulnerability.via || []).some(issue => {
              if (typeof issue === 'string') {
                return reachesAllowedAdvisory(issue, nextVisiting);
              }
              return issue && typeof issue === 'object' &&
                issue.url?.endsWith('/' + allowedAdvisory);
            });
          };

          const blocking = Object.values(vulnerabilities).filter(v =>
            (v.severity === 'high' || v.severity === 'critical') &&
            !reachesAllowedAdvisory(v.name)
          );

          if (blocking.length) {
            console.error('Blocking high/critical frontend vulnerabilities remain:');
            for (const v of blocking) {
              console.error(JSON.stringify({
                name: v.name,
                severity: v.severity,
                range: v.range,
                direct: v.isDirect,
                via: v.via,
                fixAvailable: v.fixAvailable
              }));
            }
            process.exit(1);
          }

          console.log('No blocking high/critical development dependency vulnerabilities found.');
          NODE
