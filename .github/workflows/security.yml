name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go-security:
    name: Go security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26.x'
          go-package: './...'

  frontend-security:
    name: Frontend dependency security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Audit production dependencies
        run: npm install --package-lock-only --ignore-scripts && npm audit --omit=dev --audit-level=high

      - name: Audit development dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const allowed = new Set(['GHSA-vfj7-8cjw-p6xm']);
          const vulnerabilities = Object.values(report.vulnerabilities || {});
          const blocking = vulnerabilities.filter(v =>
            (v.severity === 'high' || v.severity === 'critical') &&
            !(v.via || []).some(issue =>
              typeof issue === 'object' && allowed.has(issue.url?.split('/').pop())
            )
          );
          if (blocking.length) {
            console.error('Blocking high/critical frontend vulnerabilities remain:');
            for (const v of blocking) console.error('- ' + v.name + ': ' + v.severity);
            process.exit(1);
          }
          console.log('No blocking high/critical development dependency vulnerabilities found.');
          console.log('GHSA-vfj7-8cjw-p6xm is temporarily allowed because braces has no patched release.');
          NODE

      - name: Build
        run: npm run build
