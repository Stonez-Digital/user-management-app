name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Go vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26.x'
          go-package: './...'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate dependency lock for audit
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Audit development dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          const allowedAdvisory = 'GHSA-vfj7-8cjw-p6xm';

          // Permit only the known unpatched braces advisory and its
          // transitive dependency chain; all other high/critical findings block.
          const reachesAllowedAdvisory = (packageName, visiting = new Set()) => {
            if (packageName === 'braces') return true;
            if (visiting.has(packageName)) return false;

            const vulnerability = vulnerabilities[packageName];
            if (!vulnerability) return false;

            const nextVisiting = new Set(visiting);
            nextVisiting.add(packageName);

            return (vulnerability.via || []).some(issue => {
              if (typeof issue === 'string') {
                return reachesAllowedAdvisory(issue, nextVisiting);
              }
              if (issue && typeof issue === 'object') {
                return issue.url?.endsWith('/' + allowedAdvisory);
              }
              return false;
            });
          };

          const blocking = Object.values(vulnerabilities).filter(v =>
            (v.severity === 'high' || v.severity === 'critical') &&
            !reachesAllowedAdvisory(v.name)
          );

          if (blocking.length) {
            console.error('Blocking high/critical frontend vulnerabilities remain:');
            for (const v of blocking) {
              console.error('- ' + v.name + ': ' + v.severity);
            }
            process.exit(1);
          }

          console.log('No blocking high/critical development dependency vulnerabilities found.');
          console.log('The braces advisory is allowed only for the known unpatched advisory and its dependency chain.');
          NODE
